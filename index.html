<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>学習アプリ</title>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<style>

.questionImage{

    max-width:90%;

    max-height:400px;

    display:block;

    margin:20px auto;

    border-radius:10px;

}

/* =========================
   全体
========================= */

body{

    font-family:
    "Noto Sans JP",
    sans-serif;

    background:#f0f0f0;

    text-align:center;

    margin:0;

    color:#222;

}


/* =========================
   共通
========================= */

.hidden{

    display:none !important;

}


.screen{

    padding:30px;

    min-height:100vh;

    box-sizing:border-box;

}


button{

    cursor:pointer;

    padding:10px 20px;

    margin:5px;

    font-size:16px;

}


.mainBtn{

    width:400px;

    max-width:90%;

    display:block;

    margin:10px auto;

    font-size:20px;

}


.homeBtn{

    margin-top:25px;

}


.box{

    background:#1f5d7a;

    color:white;

    padding:20px;

    width:700px;

    max-width:90%;

    margin:20px auto;

    box-sizing:border-box;

}


/* =========================
   問題
========================= */

.tutorialQuestion{

    background:#1f5d7a;

    color:white;

    padding:20px;

    width:650px;

    max-width:90%;

    margin:20px auto;

    font-size:22px;

}


.realQuestionBox{

    background:#1f5d7a;

    color:white;

    padding:25px;

    width:700px;

    max-width:90%;

    margin:20px auto;

    font-size:24px;

}


/* =========================
   回答入力
========================= */

.answerInput{

    width:500px;

    max-width:80%;

    padding:15px;

    font-size:20px;

}


.realInput{

    width:500px;

    max-width:80%;

    padding:15px;

    font-size:20px;

}


/* =========================
   前へ・次へ
========================= */

.navigationButtons{

    margin-top:20px;

}


.navigationButtons button{

    min-width:150px;

}


/* =========================
   解説ボタン
========================= */

.explanationButtons{

    display:flex;

    justify-content:center;

    gap:20px;

    margin:30px auto;

}


.explanationBtn{

    width:180px;

    height:150px;

    border-radius:30px;

    background:white;

    border:2px solid #222;

    font-size:20px;

}


.explanationBtn:hover{

    background:#e5e5e5;

}


/* =========================
   解説モーダル
========================= */

.explanationModal{

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:rgba(0,0,0,0.6);

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:1000;

}


/* 白い枠と閉じるボタンをまとめる */

.explanationWrapper{

    width:80%;

    max-width:900px;

    display:flex;

    flex-direction:column;

    align-items:center;

}


/* 白い解説枠 */

.explanationModalContent{

    background:white;

    width:100%;

    height:70vh;

    padding:30px;

    box-sizing:border-box;

    overflow:auto;

}


/* 画像 */

.explanationModalContent img{

    max-width:90%;

    max-height:500px;

}


/* 動画 */

.explanationModalContent iframe{

    width:90%;

    max-width:700px;

    height:400px;

    border:none;

}


/* 閉じるボタン */

.closeBtn{

    margin-top:15px;

    padding:10px 30px;

    font-size:16px;

    background:white;

    border:2px solid #222;

    cursor:pointer;

}

/* =========================
   正解・不正解
========================= */

.correct{

    color:green;

    font-size:32px;

    font-weight:bold;

}


.wrong{

    color:red;

    font-size:32px;

    font-weight:bold;

}


/* =========================
   判定モーダル
========================= */

.modal{

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:
    rgba(0,0,0,0.5);

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:900;

}


.modalContent{

    background:white;

    padding:30px;

    width:400px;

    max-width:90%;

}


/* =========================
   結果
========================= */

.resultBox{

    background:white;

    border:2px solid #222;

    width:600px;

    max-width:90%;

    margin:30px auto;

    padding:30px;

    font-size:20px;

}


/* =========================
   アンケート
========================= */

.surveyBox{

    background:white;

    border:2px solid #222;

    width:700px;

    max-width:90%;

    margin:30px auto;

    padding:30px;

    box-sizing:border-box;

}


.surveyQuestion{

    font-size:22px;

    font-weight:bold;

    margin-bottom:20px;

}


.surveyOption{

    display:block;

    width:300px;

    max-width:90%;

    margin:10px auto;

    padding:15px;

    font-size:18px;

}


.surveyReason{

    width:90%;

    max-width:600px;

    height:150px;

    padding:15px;

    font-size:16px;

    box-sizing:border-box;

}


.surveyMessage{

    font-size:18px;

    font-weight:bold;

    margin:20px;

}


/* =========================
   スマホ
========================= */

@media(max-width:700px){

    .mainBtn{

        width:90%;

    }


    .explanationButtons{

        flex-direction:column;

        align-items:center;

    }


    .explanationBtn{

        width:250px;

    }


    .explanationModalContent iframe{

        height:250px;

    }

}

</style>

</head>


<body>


<!-- ==================================================
     学年選択
================================================== -->

<div id="gradeScreen"
     class="screen">

    <h1>学年を選択</h1>


    <button
        class="mainBtn"
        onclick="openCategory('elementary')">

        小学生

    </button>


    <button
        class="mainBtn"
        onclick="openCategory('junior')">

        中学生

    </button>


    <button
        class="mainBtn"
        onclick="openCategory('high')">

        高校生

    </button>

</div>



<!-- ==================================================
     問題選択
================================================== -->

<div id="selectScreen"
     class="screen hidden">

    <h1>問題選択</h1>


    <div id="questionList"></div>


    <button
        class="homeBtn"
        onclick="showGradeScreen()">

        学年選択へ

    </button>

</div>



<!-- ==================================================
     チュートリアル
================================================== -->

<div id="tutorialScreen"
     class="screen hidden">

    <h1>チュートリアル</h1>


    <h2 id="tutorialCounter"></h2>


    <div id="tutorialQuestion"
         class="tutorialQuestion">

    </div>


    <!-- 回答入力 -->

    <input
        id="tutorialInput"
        class="answerInput"
        type="text"
        placeholder="答えを入力">


    <br>


    <button
        onclick="checkTutorial()">

        答え合わせ

    </button>


    <!-- 解説 -->

    <div id="explanationButtons"
         class="explanationButtons">

    </div>


    <!-- 前へ・次へ -->

    <div class="navigationButtons">

        <button
            id="prevTutorialBtn"
            onclick="prevTutorial()">

            ひとつ前へ

        </button>


        <button
            id="nextTutorialBtn"
            onclick="nextTutorial()">

            次へ

        </button>


        <button
            id="startRealBtn"
            class="hidden"
            onclick="startRealProblem()">

            本番問題へ

        </button>

    </div>


    <br>


    <button
        class="homeBtn"
        onclick="showHome()">

        問題選択へ

    </button>

</div>



<!-- ==================================================
     チュートリアル判定モーダル
================================================== -->

<div id="tutorialJudgeModal"
     class="modal hidden">

    <div class="modalContent">

        <h2 id="tutorialJudgeText"></h2>


        <div id="tutorialJudgeExplanation"></div>


        <button
            onclick="closeTutorialJudge()">

            閉じる

        </button>

    </div>

</div>



<!-- ==================================================
     解説モーダル
================================================== -->

<div id="explanationModal"
     class="explanationModal hidden">

    <div class="explanationWrapper">

        <div class="explanationModalContent">

            <h2 id="modalTitle"></h2>

            <div id="modalContent"></div>

        </div>


        <button
            class="closeBtn"
            onclick="closeExplanation()">

            閉じる

        </button>

    </div>

</div>


<!-- ==================================================
     本番問題
================================================== -->

<div id="realScreen"
     class="screen hidden">

    <h1>本番問題</h1>


    <h2 id="realCounter"></h2>


    <div id="realQuestion"
         class="realQuestionBox">

    </div>


    <input
        id="realInput"
        class="realInput"
        type="text"
        placeholder="答えを入力">


    <br><br>


    <button
        onclick="checkReal()">

        答え合わせ

    </button>


    <div class="navigationButtons">

        <button
            id="prevRealBtn"
            onclick="prevRealQuestion()">

            ひとつ前へ

        </button>


        <button
            id="nextRealBtn"
            onclick="nextRealQuestion()">

            次へ

        </button>

    </div>


    <br>


    <button
        class="homeBtn"
        onclick="showHome()">

        問題選択へ

    </button>

</div>



<!-- ==================================================
     本番問題 判定モーダル
================================================== -->

<div id="realJudgeModal"
     class="modal hidden">

    <div class="modalContent">

        <h2 id="realJudgeText"></h2>


        <div id="realJudgeExplanation"></div>


        <button
            onclick="closeRealJudge()">

            閉じる

        </button>

    </div>

</div>



<!-- ==================================================
     本番問題 結果
================================================== -->

<div id="realResultScreen"
     class="screen hidden">

    <h1>本番問題 結果</h1>


    <div
        id="realScoreText"
        class="resultBox">

    </div>


    <button
        onclick="showSurvey()">

        アンケートへ

    </button>

</div>



<!-- ==================================================
     アンケート
================================================== -->

<div id="surveyScreen"
     class="screen hidden">

    <h1>アンケート</h1>


    <div class="surveyBox">

        <div class="surveyQuestion">

            Q. どのチュートリアルが分かりやすかったですか？

        </div>


        <label>

            <input
                type="radio"
                name="tutorialType"
                value="文章">

            文章

        </label>


        <br><br>


        <label>

            <input
                type="radio"
                name="tutorialType"
                value="画像">

            画像

        </label>


        <br><br>


        <label>

            <input
                type="radio"
                name="tutorialType"
                value="動画">

            動画

        </label>


        <br><br><br>


        <div class="surveyQuestion">

            選んだ理由を教えてください。

        </div>


        <textarea
            id="surveyReason"
            class="surveyReason"
            placeholder="理由を入力してください">
        </textarea>


        <br><br>


        <button
            onclick="submitSurvey()">

            アンケートを送信

        </button>


        <div
            id="surveyMessage"
            class="surveyMessage">
        </div>

    </div>


    <button
        onclick="showHome()">

        問題選択へ

    </button>

</div>

const db =

/* ==================================================

================================================== */

const data = {

		    questionImage: "img/buranko_boy_sad.png",

                        },

/* ==================================================
   現在の状態
================================================== */

let currentCategory = null;

let currentUnit = null;


/* チュートリアル */

let currentTutorialIndex = 0;

let tutorialAnswers = [];

let tutorialCorrect = [];

let tutorialTimes = [];

let tutorialStartTime = 0;


/* 本番 */

let currentRealIndex = 0;

let realAnswers = [];

let realCorrect = [];

let realTimes = [];

let realScore = 0;

let realTotalTime = 0;

let realStartTime = 0;



/* ==================================================
   画面切り替え
================================================== */

function showScreen(id){

    document
    .querySelectorAll(".screen")
    .forEach(screen=>{

        screen.classList.add("hidden");

    });


    document
    .getElementById(id)
    .classList.remove("hidden");

}



/* ==================================================
   学年選択
================================================== */

function openCategory(category){

    currentCategory = category;


    const list =
    document.getElementById("questionList");


    list.innerHTML = "";


    const units = data[category];


    if(!units || units.length === 0){

        list.innerHTML =
        "<p>現在、問題はありません。</p>";

        showScreen("selectScreen");

        return;

    }


    units.forEach((unit,index)=>{

        const btn =
        document.createElement("button");


        btn.className =
        "mainBtn";


        btn.innerText =
        unit.title;


        btn.onclick = function(){

            startUnit(index);

        };


        list.appendChild(btn);

    });


    showScreen("selectScreen");

}



/* ==================================================
   単元開始
================================================== */

function startUnit(index){

    currentUnit =
    data[currentCategory][index];


    currentTutorialIndex = 0;

    currentRealIndex = 0;


    tutorialAnswers =
    new Array(currentUnit.tutorial.length).fill("");

    tutorialCorrect =
    new Array(currentUnit.tutorial.length).fill(null);

    tutorialTimes =
    new Array(currentUnit.tutorial.length).fill(0);


    realAnswers =
    new Array(currentUnit.real.length).fill("");

    realCorrect =
    new Array(currentUnit.real.length).fill(null);

    realTimes =
    new Array(currentUnit.real.length).fill(0);


    realScore = 0;

    realTotalTime = 0;


    startTutorial();

}



/* ==================================================
   チュートリアル開始
================================================== */

function startTutorial(){

    currentTutorialIndex = 0;

    showTutorialQuestion();

}



/* ==================================================
   チュートリアル表示
================================================== */

function showTutorialQuestion(){

    const pages =
    currentUnit.tutorial;


    const q =
    pages[currentTutorialIndex];


    document
    .getElementById("tutorialCounter")
    .innerText =
    `チュートリアル ${currentTutorialIndex + 1}/${pages.length}`;


   const tutorialQuestion =
    document.getElementById("tutorialQuestion");


tutorialQuestion.innerHTML = "";


/* 問題文 */

const questionText =
    document.createElement("div");

questionText.innerText =
    q.question;

tutorialQuestion.appendChild(questionText);


/* 問題画像 */

if(q.questionImage){

    const img =
        document.createElement("img");

    img.src =
        q.questionImage;


    img.className =
        "questionImage";

    tutorialQuestion.appendChild(img);

}

    /* 保存していた回答を表示 */

    document
    .getElementById("tutorialInput")
    .value =
    tutorialAnswers[currentTutorialIndex] || "";


    /* 解説 */

    const buttonArea =
    document.getElementById("explanationButtons");


    buttonArea.innerHTML = "";


    q.explanation.forEach(explanation=>{

        const btn =
        document.createElement("button");


        btn.className =
        "explanationBtn";


        btn.innerText =
        explanation.title;


        btn.onclick = function(){

            openExplanation(explanation);

        };


        buttonArea.appendChild(btn);

    });


    /* 前へボタン */

    const prev =
    document.getElementById("prevTutorialBtn");


    if(currentTutorialIndex === 0){

        prev.classList.add("hidden");

    }else{

        prev.classList.remove("hidden");

    }


    /* 最後かどうか */

    const next =
    document.getElementById("nextTutorialBtn");

    const real =
    document.getElementById("startRealBtn");


    if(currentTutorialIndex === pages.length - 1){

        next.classList.add("hidden");

        real.classList.remove("hidden");

    }else{

        next.classList.remove("hidden");

        real.classList.add("hidden");

    }


    /* 未回答ならタイマー開始 */

    if(
        tutorialAnswers[currentTutorialIndex] === ""
    ){

        tutorialStartTime = Date.now();

    }


    showScreen("tutorialScreen");

}



/* ==================================================
   チュートリアル採点
================================================== */

function checkTutorial(){

    const q =
    currentUnit.tutorial[currentTutorialIndex];


    const input =
    document
    .getElementById("tutorialInput")
    .value;


    const userAnswer =
    normalizeAnswer(input);


    if(userAnswer === ""){

        alert("答えを入力してください。");

        return;

    }


    tutorialAnswers[currentTutorialIndex] =
    input;


    /* 初回回答時だけ時間を記録 */

    if(tutorialCorrect[currentTutorialIndex] === null){

        const time =
        Math.floor(
            (Date.now() - tutorialStartTime) / 1000
        );

        tutorialTimes[currentTutorialIndex] =
        time;

    }


    const correctAnswer =
    normalizeAnswer(q.answer);


    const isCorrect =
    userAnswer === correctAnswer;


    tutorialCorrect[currentTutorialIndex] =
    isCorrect;


    const judge =
    document.getElementById(
        "tutorialJudgeText"
    );


    const explanation =
    document.getElementById(
        "tutorialJudgeExplanation"
    );


    /* 今までと同じ正誤表示 */

    if(isCorrect){

        judge.innerHTML =
        `<div class="correct">正解！</div>`;

    }else{

        judge.innerHTML =
        `<div class="wrong">不正解</div>`;

    }


    explanation.innerHTML =
    `
    <p>
        解答時間：
        ${tutorialTimes[currentTutorialIndex]}秒
    </p>

    <p>
        正解：
        ${q.answer}
    </p>

    <p>
        ${q.explanation[0]?.content || ""}
    </p>
    `;


    document
    .getElementById("tutorialJudgeModal")
    .classList.remove("hidden");

}



/* ==================================================
   チュートリアル判定を閉じる
================================================== */

function closeTutorialJudge(){

    document
    .getElementById("tutorialJudgeModal")
    .classList.add("hidden");

}



/* ==================================================
   チュートリアル 前へ
================================================== */

function prevTutorial(){

    if(currentTutorialIndex > 0){

        currentTutorialIndex--;

        closeTutorialJudge();

        showTutorialQuestion();

    }

}



/* ==================================================
   チュートリアル 次へ
================================================== */

function nextTutorial(){

    if(
        currentTutorialIndex <
        currentUnit.tutorial.length - 1
    ){

        currentTutorialIndex++;

        showTutorialQuestion();

    }

}



/* ==================================================
   解説を開く
================================================== */

function openExplanation(explanation){

    const modal =
    document.getElementById(
        "explanationModal"
    );


    const title =
    document.getElementById(
        "modalTitle"
    );


    const content =
    document.getElementById(
        "modalContent"
    );


    title.innerText =
    explanation.title;


    content.innerHTML = "";


    if(explanation.type === "text"){

        content.innerHTML =
        `<p>${explanation.content}</p>`;

    }


    else if(explanation.type === "image"){

        content.innerHTML =
        `
        <img
            src="${explanation.src}"
            alt="解説画像">
        `;

    }


    else if(explanation.type === "video"){

        content.innerHTML =
        `
        <iframe
            src="${explanation.src}"
            allowfullscreen>
        </iframe>
        `;

    }


    modal.classList.remove("hidden");

}



/* ==================================================
   解説を閉じる
================================================== */

function closeExplanation(){

    document
    .getElementById("explanationModal")
    .classList.add("hidden");


    document
    .getElementById("modalContent")
    .innerHTML = "";

}



/* ==================================================
   本番問題開始
================================================== */

function startRealProblem(){

    currentRealIndex = 0;

    realScore = 0;

    realTotalTime = 0;


    showRealQuestion();

}



/* ==================================================
   本番問題表示
================================================== */

function showRealQuestion(){

    const q =
    currentUnit.real[currentRealIndex];


    document
    .getElementById("realCounter")
    .innerText =
    `${currentRealIndex + 1}/${currentUnit.real.length}問`;


    const realQuestion =
    document.getElementById("realQuestion");


realQuestion.innerHTML = "";


/* 問題文 */

const questionText =
    document.createElement("div");

questionText.innerText =
    q.question;

realQuestion.appendChild(questionText);


/* 問題画像 */

if(q.questionImage){

    const img =
        document.createElement("img");

    img.src =
        q.questionImage;

    img.className =
        "questionImage";

    realQuestion.appendChild(img);

}

    /* 保存した回答を表示 */

    document
    .getElementById("realInput")
    .value =
    realAnswers[currentRealIndex] || "";


    /* 前へ */

    const prev =
    document.getElementById("prevRealBtn");


    if(currentRealIndex === 0){

        prev.classList.add("hidden");

    }else{

        prev.classList.remove("hidden");

    }


    /* 最後なら次へを表示 */

    const next =
    document.getElementById("nextRealBtn");


    next.innerText =
    currentRealIndex === currentUnit.real.length - 1
    ? "結果を見る"
    : "次へ";


    /* 未回答ならタイマー開始 */

    if(
        realAnswers[currentRealIndex] === ""
    ){

        realStartTime =
        Date.now();

    }


    showScreen("realScreen");

}



/* ==================================================
   本番問題採点
================================================== */

function checkReal(){

    const q =
    currentUnit.real[currentRealIndex];


    const input =
    document
    .getElementById("realInput")
    .value;


    const userAnswer =
    normalizeAnswer(input);


    if(userAnswer === ""){

        alert("答えを入力してください。");

        return;

    }


    realAnswers[currentRealIndex] =
    input;


    /* 初回回答時だけ時間を記録 */

    if(realCorrect[currentRealIndex] === null){

        const time =
        Math.floor(
            (Date.now() - realStartTime) / 1000
        );

        realTimes[currentRealIndex] =
        time;

    }


    const correctAnswer =
    normalizeAnswer(q.answer);


    const isCorrect =
    userAnswer === correctAnswer;


    /* 前回正解だった場合などを考慮してScoreを再計算 */

    realCorrect[currentRealIndex] =
    isCorrect;


    realScore =
    realCorrect.filter(
        answer => answer === true
    ).length;


    realTotalTime =
    realTimes.reduce(
        (sum,time)=>sum + time,
        0
    );


    const judge =
    document.getElementById(
        "realJudgeText"
    );


    const explanation =
    document.getElementById(
        "realJudgeExplanation"
    );


    /* 今までと同じ表示 */

    if(isCorrect){

        judge.innerHTML =
        `<div class="correct">正解！</div>`;

    }else{

        judge.innerHTML =
        `<div class="wrong">不正解</div>`;

    }


    explanation.innerHTML =
    `
    <p>
        解答時間：
        ${realTimes[currentRealIndex]}秒
    </p>

    <p>
        正解：
        ${q.answer}
    </p>

    <p>
        ${q.explanation || ""}
    </p>
    `;


    document
    .getElementById("realJudgeModal")
    .classList.remove("hidden");

}



/* ==================================================
   本番判定を閉じる
================================================== */

function closeRealJudge(){

    document
    .getElementById("realJudgeModal")
    .classList.add("hidden");

}



/* ==================================================
   本番問題 前へ
================================================== */

function prevRealQuestion(){

    if(currentRealIndex > 0){

        currentRealIndex--;

        closeRealJudge();

        showRealQuestion();

    }

}



/* ==================================================
   本番問題 次へ
================================================== */

function nextRealQuestion(){

    closeRealJudge();


    if(
        currentRealIndex <
        currentUnit.real.length - 1
    ){

        currentRealIndex++;

        showRealQuestion();

    }else{

        showRealResult();

    }

}



/* ==================================================
   本番問題 結果
================================================== */

function showRealResult(){

    const total =
    currentUnit.real.length;


    realScore =
    realCorrect.filter(
        answer => answer === true
    ).length;


    realTotalTime =
    realTimes.reduce(
        (sum,time)=>sum + time,
        0
    );


    const rate =
    total === 0
    ? 0
    : realScore / total * 100;


    document
    .getElementById("realScoreText")
    .innerHTML =
    `
    <p>
        ${total}問中
        <strong>${realScore}問正解</strong>
    </p>

    <p>
        正答率：
        <strong>
        ${rate.toFixed(0)}%
        </strong>
    </p>

    <p>
        合計解答時間：
        <strong>
        ${realTotalTime}秒
        </strong>
    </p>
    `;


    showScreen("realResultScreen");

}



/* ==================================================
   アンケート表示
================================================== */

function showSurvey(){

    document
    .getElementById("surveyMessage")
    .innerText = "";


    document
    .getElementById("surveyReason")
    .value = "";


    document
    .querySelectorAll(
        'input[name="tutorialType"]'
    )
    .forEach(radio=>{

        radio.checked = false;

    });


    showScreen("surveyScreen");

}



/* ==================================================
   アンケート送信
================================================== */

async function submitSurvey(){

    const selected =
    document.querySelector(
        'input[name="tutorialType"]:checked'
    );


    const reason =
    document
    .getElementById("surveyReason")
    .value
    .trim();


    const message =
    document.getElementById(
        "surveyMessage"
    );


    if(!selected){

        alert(
            "「どのチュートリアルが分かりやすかったか」を選択してください。"
        );

        return;

    }


    if(reason === ""){

        alert(
            "選んだ理由を入力してください。"
        );

        return;

    }


    try{

        await db
        .collection("surveys")
        .add({

            tutorialType:
                selected.value,

            reason:
                reason,

            category:
                currentCategory,

            unit:
                currentUnit.title,

            realScore:
                realScore,

            realTotal:
                currentUnit.real.length,

            realTotalTime:
                realTotalTime,

            createdAt:
                firebase.firestore.FieldValue.serverTimestamp()

        });


        message.innerText =
        "アンケートを送信しました。ありがとうございます！";


    }catch(error){

        console.error(error);


        message.innerText =
        "送信に失敗しました。Firebaseの設定を確認してください。";

    }

}



/* ==================================================
   回答の正規化
================================================== */

function normalizeAnswer(value){

    return value

        .replace(/[Ａ-Ｚａ-ｚ０-９]/g,
        function(s){

            return String.fromCharCode(
                s.charCodeAt(0) - 0xFEE0
            );

        })

        .replace(/　/g," ")

        .trim()

        .toLowerCase();

}

   学年選択へ
================================================== */

function showGradeScreen(){

    currentCategory = null;

    currentUnit = null;

    showScreen("gradeScreen");

}

   問題選択へ
================================================== */

function showHome(){

    document
    .getElementById("explanationModal")
    .classList.add("hidden");


    document
    .getElementById("tutorialJudgeModal")
    .classList.add("hidden");


    document
    .getElementById("realJudgeModal")
    .classList.add("hidden");


    currentTutorialIndex = 0;

    currentRealIndex = 0;


    tutorialAnswers = [];

    tutorialCorrect = [];

    tutorialTimes = [];


    realAnswers = [];

    realCorrect = [];

    realTimes = [];


    realScore = 0;

    realTotalTime = 0;

    realStartTime = 0;


    if(currentCategory){

        openCategory(currentCategory);

    }else{

        showScreen("gradeScreen");

    }

}
